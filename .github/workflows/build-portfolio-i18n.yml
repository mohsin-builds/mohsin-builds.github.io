name: Build Italian portfolio pages

on:
  push:
    branches: [feat/portfolio-sitewide-en-it-20261024]
    paths: [.github/workflows/build-portfolio-i18n.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-sitewide-en-it-20261024
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline translation tools
        run: python -m pip install argostranslate beautifulsoup4 lxml
      - name: Translate static pages and add language navigation
        run: python .github/scripts/build_portfolio_i18n.py
      - name: Validate translated files
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse
          root=Path('.')
          pages=sorted((root/'it').glob('*.html'))
          assert len(pages)==12, f'Expected 12 pages, found {len(pages)}'
          for file in pages:
            s=BeautifulSoup(file.read_text(), 'html.parser')
            assert s.html.get('lang')=='it'
            assert s.select_one('link[rel="canonical"]')['href'].startswith('https://mohsinbuilds.com/it/')
            assert len(s.select('link[hreflang]'))>=3
            assert s.select_one('script[src*="site-language.js"]')
            for im in s.select('img[src]'):
              url=im['src']
              if url.startswith('/') and not url.startswith('//'):
                assert (root/url.lstrip('/').split('?')[0]).exists(), (file,url)
          assert all('site-language.js' in (root/f).read_text() for f in ['index.html','about.html','projects.html','contact.html','blog/index.html'])
          print('PASS: 12 Italian portfolio pages, metadata, language script and local images')
          PY
      - name: Commit translated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add it/ blog/ index.html about.html architecture.html projects.html labs.html contact.html case-studies.html mohsin-labs-os.html mohsin-labs-case-study.html mohsin-tools-case-study.html product-opportunity-engine-case-study.html website-cost-calculator-case-study.html sitemap.xml
          git diff --cached --check
          git commit -m "feat: translate full Developer OS portfolio into Italian" || exit 0
          git push origin HEAD:feat/portfolio-sitewide-en-it-20261024
