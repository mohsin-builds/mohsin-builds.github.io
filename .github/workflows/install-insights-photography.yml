name: Install real Insights photographs

on:
  push:
    branches:
      - fix/insights-real-photography-20261023
    paths:
      - ".github/workflows/install-insights-photography.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout photography branch
        uses: actions/checkout@v4
        with:
          ref: fix/insights-real-photography-20261023
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for JPEG validation
        run: python -m pip install pillow
      - name: Fetch licensed editorial photographs and replace all blog references
        run: python .github/scripts/install_insights_photos.py
      - name: Verify every cover is a real JPEG and no SVG is referenced
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          root=Path('blog')
          index=(root/'index.html').read_text()
          covers=list(Path('assets/insights').glob('*-cover.jpg'))
          assert len(covers)==12, f'Expected 12 JPEG covers, found {len(covers)}'
          assert '-cover.svg' not in index
          for cover in covers:
            with Image.open(cover) as photo:
              assert photo.format=='JPEG' and photo.size==(1200,630), cover
            slug=cover.name.removesuffix('-cover.jpg')
            article=(root/(slug+'.html')).read_text()
            assert slug+'-cover.jpg' in article
            assert slug+'-cover.svg' not in article
            assert 'og:image:type" content="image/jpeg"' in article
            assert '<figcaption>' in article
          print('PASS: all 12 locally hosted editorial photographs and blog references')
          PY
      - name: Commit and push only photography and blog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insights/*-cover.jpg assets/insights/PHOTO_CREDITS.json blog/index.html blog/*html
          git diff --cached --check
          git commit -m "feat: replace all twelve Insights illustrations with credited real photographs"
          git push origin HEAD:fix/insights-real-photography-20261023
