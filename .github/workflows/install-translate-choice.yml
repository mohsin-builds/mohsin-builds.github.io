name: Install simple translate selector
on:
  push:
    branches: [fix/restore-original-portfolio-google-translate-link-20261024]
    paths: [.github/workflows/install-translate-choice.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-original-portfolio-google-translate-link-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/install-translate-choice.py
      - name: Validate old and new paths
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          assert len(list(Path('it').glob('*.html')))==0
          assert not Path('blog/it').exists()
          assert not Path('blog/en').exists()
          files=list(Path('blog').glob('*.html'))+list(Path('.').glob('*.html'))
          files=[x for x in files if not x.name.startswith('google')]
          assert all('google-translate-choice.js' in x.read_text() for x in files)
          ElementTree.parse('sitemap.xml')
          assert len(list(Path('assets/insights').glob('*-cover.jpg')))==12
          print('PASS: originals only, 12 photos, valid sitemap, shared choice')
          PY
      - name: Commit updated original HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' blog/
          git diff --cached --check
          git commit -m "feat: add Google translation choice to original English website"
          git push origin HEAD:fix/restore-original-portfolio-google-translate-link-20261024
