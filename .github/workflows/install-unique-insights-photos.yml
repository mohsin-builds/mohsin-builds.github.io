name: Install distinct Insights photos
on:
  push:
    branches: [fix/insights-30-unique-photos-and-topics-20261025]
    paths: [.github/workflows/install-unique-insights-photos.yml]
permissions:
  contents: write
jobs:
  replace-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/insights-30-unique-photos-and-topics-20261025
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python .github/scripts/unique-insights-photography.py
      - name: Commit verified photographs and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insights/ blog/
          git diff --cached --check
          git commit -m "fix: provide each of 30 Insights articles a distinct real photo"
          git push origin HEAD:fix/insights-30-unique-photos-and-topics-20261025

# Retry with source-verified Pexels CDN photograph URLs.

# Run again after adding the final three article cards to Insights.
